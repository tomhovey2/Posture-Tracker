<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1012">
<title>Lift Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f1012;
    --surface: #18191c;
    --surface-2: #202226;
    --line: #2b2d32;
    --text: #ecedef;
    --muted: #93969e;
    --dim: #5d6067;
    --iron: #8f9bb3;
    --iron-deep: #6b7794;
    --rust: #c9623f;
    --good: #7fb37a;
    --upper-c: #8f9bb3;
    --abs-c: #c9623f;
    --lower-c: #6b8f6b;
  }
  html, body { background: var(--bg); color: var(--text); min-height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    max-width: 640px; margin: 0 auto;
    padding: env(safe-area-inset-top) 18px calc(110px + env(safe-area-inset-bottom));
  }

  header { padding: 28px 0 6px; }
  .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
  .tagline { font-size: 11.5px; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 7px; font-weight: 600; }

  /* Split bar */
  .splitbar {
    margin-top: 20px; display: flex; height: 10px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--line);
  }
  .splitbar div:nth-child(1) { background: var(--upper-c); flex: 60; }
  .splitbar div:nth-child(2) { background: var(--abs-c); flex: 30; }
  .splitbar div:nth-child(3) { background: var(--lower-c); flex: 10; }
  .splitkey { display: flex; gap: 16px; margin-top: 9px; font-size: 11px; color: var(--muted); }
  .splitkey span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* Nav tabs */
  .tabs {
    display: flex; gap: 6px; margin-top: 22px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; padding: 5px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 9px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    background: transparent; border: none; cursor: pointer;
    transition: all 0.18s ease; white-space: nowrap;
  }
  .tab.active { background: var(--iron-deep); color: #0f1012; }

  .section { margin-top: 22px; animation: fade 0.25s ease; }
  @keyframes fade { from { opacity:0; transform: translateY(5px);} to {opacity:1; transform:none;} }
  .section-intro { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }

  /* Day picker (for Train tab) */
  .daypicker { display: flex; gap: 8px; margin-bottom: 18px; }
  .daybtn {
    flex: 1; padding: 11px 6px; text-align: center; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s;
  }
  .daybtn.active { background: var(--iron-deep); color: #0f1012; border-color: var(--iron-deep); }

  .group-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    margin: 20px 2px 10px; display: flex; align-items: center; gap: 7px;
  }
  .group-label.upper { color: var(--upper-c); }
  .group-label.abs { color: var(--abs-c); }
  .group-label.lower { color: var(--lower-c); }
  .group-label:first-of-type { margin-top: 2px; }

  /* Exercise card */
  .ex {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 15px; padding: 14px 15px; margin-bottom: 9px;
  }
  .ex-top { display: flex; align-items: center; gap: 13px; cursor: pointer; user-select: none; }
  .check {
    width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0;
    border: 2px solid var(--line); position: relative; transition: all 0.18s ease;
  }
  .ex.done .check { background: var(--good); border-color: var(--good); }
  .check svg { position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; opacity: 0; transform: scale(0.5); transition: all 0.18s; }
  .ex.done .check svg { opacity: 1; transform: scale(1); }
  .ex-body { flex: 1; min-width: 0; }
  .ex-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .ex.done .ex-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--dim); }
  .ex-dose { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .info {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--muted);
    font-size: 11px; font-weight: 700; display: flex; align-items: center;
    justify-content: center; font-style: italic;
  }
  .ex.show-cue .info { background: var(--iron-deep); color: #0f1012; border-color: var(--iron-deep); }

  .ex-how { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, margin-top 0.3s ease; }
  .ex.show-cue .ex-how { max-height: 500px; margin-top: 12px; }
  .how-label { font-size: 10px; font-weight: 700; color: var(--iron); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 7px; }
  .how-steps { list-style: none; counter-reset: step; }
  .how-steps li { position: relative; padding-left: 24px; margin-bottom: 7px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .how-steps li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: 0; top: 0; width: 17px; height: 17px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--iron-deep); color: var(--iron);
    font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .how-cue { margin-top: 9px; padding: 9px 11px; background: var(--bg); border-radius: 9px; border-left: 2px solid var(--rust); font-size: 11.5px; color: var(--text); line-height: 1.5; }
  .how-cue b { color: var(--rust); }

  /* Weight log row */
  .logrow {
    margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .logrow label { font-size: 11px; color: var(--dim); font-weight: 600; white-space: nowrap; }
  .logrow input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); font-size: 14px; font-weight: 600; padding: 8px 10px;
    font-family: inherit; min-width: 0;
  }
  .logrow input:focus { outline: none; border-color: var(--iron-deep); }
  .logrow .unit { font-size: 11px; color: var(--dim); }
  .logrow .saved-flag { font-size: 10px; color: var(--good); font-weight: 700; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  .logrow .saved-flag.show { opacity: 1; }
  .lastweight { margin-top: 7px; font-size: 11px; color: var(--dim); }
  .lastweight b { color: var(--iron); font-weight: 700; }

  /* History tab */
  .hist-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
  .hist-toggle button {
    flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .hist-toggle button.active { background: var(--iron-deep); color: #0f1012; border-color: var(--iron-deep); }
  .hist-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px; margin-bottom: 10px;
  }
  .hist-ex-name { font-size: 13.5px; font-weight: 700; }
  .hist-entries { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .hist-entry { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
  .hist-entry .d { color: var(--dim); }
  .hist-entry .w { color: var(--text); font-weight: 600; }
  .hist-empty { font-size: 12.5px; color: var(--dim); text-align: center; padding: 30px 0; }
  .hist-trend { font-size: 10.5px; margin-top: 6px; font-weight: 700; }
  .trend-up { color: var(--good); }
  .trend-flat { color: var(--dim); }
  .trend-down { color: var(--rust); }

  .summary-band {
    background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
    padding: 16px 18px; margin-bottom: 16px; display: flex; gap: 22px;
  }
  .summary-stat .num { font-size: 22px; font-weight: 800; line-height: 1; }
  .summary-stat .lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 5px; }

  .reset-wrap { margin-top: 24px; text-align: center; }
  .reset {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-size: 12.5px; font-weight: 500; padding: 10px 20px; border-radius: 10px; cursor: pointer;
  }
  .reset:active { background: var(--surface); }

  footer { text-align: center; font-size: 10.5px; color: var(--dim); margin-top: 30px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="brand">Lift Tracker</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="train">Train</button>
  <button class="tab" data-tab="history">History</button>
</div>

<div id="content"></div>

<footer>Weights save on this device, organized by day logged.<br>Progressive overload — add a little weight or a rep whenever you hit the top of a range.</footer>

<script>
const PLAN = {
  A: {
    label: "Day A",
    items: [
      { id: "a_bench", name: "DB Bench Press", dose: "4 × 8", cat: "upper",
        steps: ["Lie on a flat bench, a dumbbell in each hand at chest level.", "Press up until arms are straight, dumbbells over the chest.", "Lower under control until you feel a stretch across the chest.", "4 sets of 8, all sets before moving on."],
        cue: "<b>Blades retracted into the bench</b> — protects the shoulders and hits the chest better." },
      { id: "a_cablecrunch", name: "Cable Crunch", dose: "3 × 12–15", cat: "abs",
        steps: ["Kneel below a high cable with a rope attachment, rope at the back of your neck/shoulders.", "Hips stay fixed — curl your torso down, bringing elbows toward your thighs.", "Squeeze the abs hard at the bottom, control back up.", "3 sets of 12–15."],
        cue: "<b>Curl from the ribs, not the hips.</b> Flexion-dominant — complements the lower-ab work below." },
      { id: "a_row", name: "Barbell Row", dose: "4 × 8", cat: "upper",
        steps: ["Hinge at the hips, flat back, bar hanging at knee height.", "Row the bar to your lower ribs, driving the elbows back.", "Squeeze the shoulder blades, lower under control.", "4 sets of 8 — main back builder."],
        cue: "<b>Flat back, lead with the elbows.</b> Pull to the lower ribs, not the chest." },
      { id: "a_hanginglegraise", name: "Hanging Leg Raise", dose: "3 × 10–12", cat: "abs",
        steps: ["Hang from a pull-up bar, core braced, shoulders engaged (not a dead hang).", "Raise your legs by curling the pelvis up, not just swinging the legs.", "Lower under control — no momentum.", "3 sets of 10–12. Bend the knees if straight legs cause swinging."],
        cue: "<b>Curl the pelvis, control the descent.</b> Stop the instant you start swinging — reset instead of using momentum." },
      { id: "a_incline", name: "Incline DB Press", dose: "3 × 10–12", cat: "upper",
        steps: ["Set a bench to ~30°. Dumbbell in each hand at upper-chest level.", "Press up and slightly together, control back down.", "3 sets of 10–12 — higher reps for muscle growth.", "Lighter than flat bench; focus on the squeeze."],
        cue: "<b>Hypertrophy reps (10–12).</b> Accessory lift — chase the pump, not a 1-rep max." },
      { id: "a_kbtrident", name: "Kettlebell Trident", dose: "3 × 10/side", cat: "abs",
        steps: ["Set up per your usual form for this move.", "Keep the core braced and ribs down throughout.", "Controlled tempo — no rushing through reps.", "3 sets of 10 per side."],
        cue: "<b>Your call on form here</b> — keep it controlled and brace before each rep." },
      { id: "a_pulldown", name: "Lat Pulldown or Pull-ups", dose: "3 × 8–10", cat: "upper",
        steps: ["Pulldown: grip slightly wider than shoulders, chest up, pull the bar to your collarbone.", "Or pull-ups: hang from the bar, pull chest toward it, elbows drive down.", "Control the return to a full stretch either way.", "3 sets of 8–10. Never behind-the-neck."],
        cue: "<b>Bar/chest to the front, full stretch at the top.</b> Lead with the elbows." },
      { id: "a_woodchop", name: "Cable Woodchop", dose: "3 × 12/side", cat: "abs",
        steps: ["Anchor high, pull down and across your body to the opposite hip, rotating the torso.", "Keep hips relatively stable — rotation comes from the core.", "Control the return, don't let the cable snap you back.", "3 sets of 12 per side."],
        cue: "<b>The oblique on the anchor side drives the rotation.</b> Alternate sides evenly." },
    ]
  },
  B: {
    label: "Day B",
    items: [
      { id: "b_legmaint", name: "Goblet Squat or Deadlift (alternate weekly)", dose: "4×8 or 3×5", cat: "lower",
        steps: ["Squat week: dumbbell vertical at chest, sit down between hips, chest tall, drive up.", "Deadlift week: bar over mid-foot, flat back, brace hard, drive through the floor.", "Alternate which one you do each week.", "Goblet 4×8, or Deadlift 3×5."],
        cue: "<b>The 10% leg piece.</b> Just enough to keep the squat/deadlift and hips from regressing." },
      { id: "b_kbpullthrough", name: "Kettlebell Plank Pull-Through", dose: "3 × 10/side", cat: "abs",
        steps: ["Set up per your usual form for this move.", "Keep hips level and square — resist the urge to rotate as you move the weight.", "Controlled tempo through the full range.", "3 sets of 10 per side."],
        cue: "<b>Your call on form here</b> — the challenge is keeping the hips still while the weight moves." },
      { id: "b_ohp", name: "Overhead Press", dose: "3 × 6", cat: "upper",
        steps: ["Barbell or dumbbells at shoulder height, core braced, glutes tight.", "Press straight overhead, head moves slightly forward at the top.", "Lock out with the bar over your mid-foot, lower under control.", "3 sets of 6."],
        cue: "<b>Brace the core, don't arch the low back.</b> Ribs down as you press." },
      { id: "b_rollout", name: "Ab Wheel Rollout", dose: "3 × 8–10", cat: "abs",
        steps: ["Kneel on a mat, hands on the ab wheel handles, wheel in front of you.", "Brace hard, roll out slowly, keeping your back flat — not sagging.", "Go only as far as you can keep the low back from arching.", "Roll back in, squeezing the abs. 3 sets of 8–10.", "No wheel? Sub a weighted plank (plate on your back) for the same job."],
        cue: "<b>Anti-extension — resist the arch.</b> Different skill than your other moves; braces the core against load, which carries straight into your heavier lifts." },
      { id: "b_dbrow", name: "DB Row or Cable Row", dose: "4 × 8", cat: "upper",
        steps: ["DB row: one hand and knee on a bench, row the dumbbell to your hip, elbow back.", "Or cable row: seated, chest up, pull to your lower ribs, squeeze the blades.", "Control the return to a full stretch.", "4 sets of 8."],
        cue: "<b>Squeeze at the top, full stretch at the bottom.</b> Second back-builder of the day." },
      { id: "b_facepull", name: "Face Pulls", dose: "3 × 15", cat: "upper",
        steps: ["Cable or band at face height, rope or ends in each hand.", "Pull toward your forehead, elbows high and wide.", "Rotate so knuckles point behind you at the end, control back.", "3 sets of 15 — both days, on purpose."],
        cue: "<b>Both days on purpose.</b> Best insurance against rounding from all the pressing." },
      { id: "b_seatedwiper", name: "Seated Windshield Wiper", dose: "3 × 10/side", cat: "abs",
        steps: ["Sit on the floor, lean back slightly on your hands behind you for support.", "Lift your legs together and sweep them side to side, under control.", "Keep the movement coming from rotating the hips/legs together, not kicking.", "3 sets of 10 per side."],
        cue: "<b>Lean back enough to stay stable, not so far you lose tension.</b> Slow and controlled beats fast swinging." },
      { id: "b_dips", name: "Dips or Barbell Curl", dose: "3 × 8–10", cat: "upper",
        steps: ["Dips: lower until upper arms are ~parallel, press back up, slight forward lean for chest.", "Or Barbell Curl: elbows pinned to sides, curl up, control down.", "3 sets of 8–10 — muscle-building range.", "Pick one; alternate week to week."],
        cue: "<b>Hypertrophy reps (8–10).</b> Controlled, full range, feel the muscle." },
    ]
  }
};

const CAT_LABEL = { upper: "Upper Body", abs: "Abs", lower: "Lower Body" };
let currentTab = 'train';
let currentDay = 'A';
let historyView = 'week';

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadAllLogs() {
  try { return JSON.parse(localStorage.getItem('loadout_logs') || '{}'); } catch { return {}; }
}
function saveAllLogs(logs) {
  try { localStorage.setItem('loadout_logs', JSON.stringify(logs)); } catch {}
}
// logs shape: { "2026-10-23": { "a_bench": { weight: "135", done: true }, ... } }

function getTodayState() {
  const logs = loadAllLogs();
  return logs[todayKey()] || {};
}
function setTodayEntry(id, patch) {
  const logs = loadAllLogs();
  const tk = todayKey();
  if (!logs[tk]) logs[tk] = {};
  logs[tk][id] = { ...(logs[tk][id] || {}), ...patch };
  saveAllLogs(logs);
}
function getLastWeight(id) {
  const logs = loadAllLogs();
  const tk = todayKey();
  const dates = Object.keys(logs).filter(d => d !== tk).sort().reverse();
  for (const d of dates) {
    if (logs[d][id] && logs[d][id].weight) return { weight: logs[d][id].weight, date: d };
  }
  return null;
}

function renderTrain() {
  const day = PLAN[currentDay];
  const state = getTodayState();
  const c = document.getElementById('content');
  let html = `
    <div class="section">
      <div class="daypicker">
        <div class="daybtn ${currentDay==='A'?'active':''}" data-day="A">Day A</div>
        <div class="daybtn ${currentDay==='B'?'active':''}" data-day="B">Day B</div>
      </div>
      <div class="section-intro">Upper and abs alternate — finish all sets of one move, then go straight to the next, no regrouping by category. Rest ~90 sec–2 min on main lifts, ~45–60 sec on accessories. Log the weight you used; it feeds History.</div>`;

  day.items.forEach((item, idx) => {
    const entry = state[item.id] || {};
    const done = entry.done ? 'done' : '';
    html += `
      <div class="ex ${done}" data-id="${item.id}">
        <div class="ex-top" data-toggle="${item.id}">
          <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#0f1012" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="ex-body">
            <div class="ex-name"><span class="dot" style="background:var(--${item.cat}-c);margin-right:7px;vertical-align:middle;"></span>${idx+1}. ${item.name}</div>
            <div class="ex-dose">${item.dose} &middot; ${CAT_LABEL[item.cat]}</div>
          </div>
          <div class="info" data-info="${item.id}">i</div>
        </div>
        <div class="ex-how">
          <div class="how-label">How to do it</div>
          <ol class="how-steps">${item.steps.map(s => `<li>${s}</li>`).join('')}</ol>
          <div class="how-cue">${item.cue}</div>
        </div>
        <div class="logrow">
          <label for="w_${item.id}">Weight</label>
          <input type="text" inputmode="decimal" id="w_${item.id}" placeholder="${(() => { const lw = getLastWeight(item.id); return lw ? `last: ${lw.weight}` : 'e.g. 35 lb or BW'; })()}" value="${entry.weight || ''}" data-weight="${item.id}">
          <span class="saved-flag" id="flag_${item.id}">saved</span>
        </div>
        ${(() => { const lw = getLastWeight(item.id); return lw ? `<div class="lastweight">Last time: <b>${lw.weight}</b> on ${new Date(lw.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>` : ''; })()}
      </div>`;
  });

  html += `<div class="reset-wrap"><button class="reset" id="resetBtn">Clear today's log</button></div></div>`;
  c.innerHTML = html;
  attachTrain();
}

function attachTrain() {
  document.querySelectorAll('.daybtn').forEach(b => {
    b.addEventListener('click', () => { currentDay = b.dataset.day; renderTrain(); });
  });
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.info')) return;
      const id = el.dataset.toggle;
      const state = getTodayState();
      const nowDone = !(state[id] && state[id].done);
      setTodayEntry(id, { done: nowDone });
      el.closest('.ex').classList.toggle('done', nowDone);
      if (navigator.vibrate && nowDone) navigator.vibrate(8);
    });
  });
  document.querySelectorAll('[data-info]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.closest('.ex').classList.toggle('show-cue');
    });
  });
  document.querySelectorAll('[data-weight]').forEach(input => {
    let t;
    input.addEventListener('input', () => {
      const id = input.dataset.weight;
      clearTimeout(t);
      t = setTimeout(() => {
        setTodayEntry(id, { weight: input.value });
        const flag = document.getElementById('flag_'+id);
        flag.classList.add('show');
        setTimeout(() => flag.classList.remove('show'), 1200);
      }, 400);
    });
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    const logs = loadAllLogs();
    delete logs[todayKey()];
    saveAllLogs(logs);
    renderTrain();
  });
}

function allExercises() {
  return [...PLAN.A.items, ...PLAN.B.items];
}

function renderHistory() {
  const c = document.getElementById('content');
  const logs = loadAllLogs();
  const dates = Object.keys(logs).sort().reverse();

  const now = new Date();
  const cutoff = new Date(now);
  if (historyView === 'week') cutoff.setDate(now.getDate() - 7);
  else cutoff.setDate(now.getDate() - 30);

  const inRange = dates.filter(d => new Date(d + 'T00:00:00') >= cutoff);

  // summary stats
  let sessionsLogged = inRange.filter(d => Object.values(logs[d]).some(e => e.done)).length;
  let liftsLogged = 0;
  inRange.forEach(d => { liftsLogged += Object.values(logs[d]).filter(e => e.weight).length; });

  let html = `<div class="section">
    <div class="hist-toggle">
      <button data-hv="week" class="${historyView==='week'?'active':''}">This Week</button>
      <button data-hv="month" class="${historyView==='month'?'active':''}">This Month</button>
    </div>
    <div class="summary-band">
      <div class="summary-stat"><div class="num">${sessionsLogged}</div><div class="lbl">sessions</div></div>
      <div class="summary-stat"><div class="num">${liftsLogged}</div><div class="lbl">weights logged</div></div>
    </div>`;

  if (inRange.length === 0) {
    html += `<div class="hist-empty">No logged sessions in this window yet.<br>Check off exercises and log weights in Train.</div></div>`;
    c.innerHTML = html;
    attachHistory();
    return;
  }

  allExercises().forEach(item => {
    const entries = inRange
      .map(d => ({ date: d, e: logs[d][item.id] }))
      .filter(x => x.e && (x.e.weight || x.e.done))
      .sort((a,b) => b.date.localeCompare(a.date));
    if (entries.length === 0) return;

    const weighted = entries.filter(x => x.e.weight);
    let trendHtml = '';
    if (weighted.length >= 2) {
      const latest = parseFloat(weighted[0].e.weight);
      const earliest = parseFloat(weighted[weighted.length-1].e.weight);
      if (!isNaN(latest) && !isNaN(earliest)) {
        if (latest > earliest) trendHtml = `<div class="hist-trend trend-up">↑ up from ${weighted[weighted.length-1].e.weight} to ${weighted[0].e.weight}</div>`;
        else if (latest < earliest) trendHtml = `<div class="hist-trend trend-down">↓ down from ${weighted[weighted.length-1].e.weight} to ${weighted[0].e.weight}</div>`;
        else trendHtml = `<div class="hist-trend trend-flat">→ holding at ${latest}</div>`;
      }
    }

    html += `<div class="hist-card">
      <div class="hist-ex-name">${item.name}</div>
      <div class="hist-entries">
        ${entries.slice(0,6).map(x => {
          const dLabel = new Date(x.date+'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'});
          return `<div class="hist-entry"><span class="d">${dLabel}</span><span class="w">${x.e.weight ? x.e.weight : (x.e.done ? '✓ done' : '')}</span></div>`;
        }).join('')}
      </div>
      ${trendHtml}
    </div>`;
  });

  html += `</div>`;
  c.innerHTML = html;
  attachHistory();
}

function attachHistory() {
  document.querySelectorAll('[data-hv]').forEach(b => {
    b.addEventListener('click', () => { historyView = b.dataset.hv; renderHistory(); });
  });
}

function render() {
  if (currentTab === 'train') renderTrain();
  else renderHistory();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    render();
  });
});

render();
</script>
</body>
</html>
